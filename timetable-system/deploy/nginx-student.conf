limit_req_zone $server_name zone=analytics_ingest:1m rate=20r/s;
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $student_backend http://student-api:8000;
    location = /healthz { access_log off; return 200 "ok\n"; }
    # Publication writes travel directly between APIs in the private network.
    location = /api/v1/publication {
        limit_except GET { deny all; }
        proxy_pass $student_backend$request_uri;
        proxy_set_header Host $host;
    }
    location = /api/v1/analytics/summary { deny all; }
    location = /api/v1/analytics/events {
        access_log off;
        limit_except POST { deny all; }
        client_max_body_size 2k;
        limit_req zone=analytics_ingest burst=100 nodelay;
        limit_req_status 429;
        proxy_pass $student_backend$request_uri;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass $student_backend$request_uri;
        proxy_set_header Host $host;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
